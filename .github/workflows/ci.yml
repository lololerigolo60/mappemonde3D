name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 1. Vérifier la syntaxe de tous les fichiers JS
      - name: Syntax check
        run: |
          node --check server.js
          node --check globe.js
          node --check ui.js
          node --check extras.js

      # 2. Démarrer le serveur brièvement et tester /api/health
      - name: Health check
        run: |
          node server.js &
          SERVER_PID=$!
          sleep 2
          RESPONSE=$(curl -sf http://127.0.0.1:3456/api/health)
          echo "Réponse : $RESPONSE"
          echo "$RESPONSE" | grep -q '"ok":true' || { kill $SERVER_PID; exit 1; }
          kill $SERVER_PID

